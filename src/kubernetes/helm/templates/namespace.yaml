# This file is intentionally left empty
# The namespace "cinemaabyss" already exists and should be used as-is
# Use the --namespace flag when installing the chart: helm install cinemaabyss .\src\kubernetes\helm --namespace cinemaabyss --create-namespace

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    name: {{ .Values.global.namespace }}
    app.kubernetes.io/name: {{ include "cinemaabyss.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}